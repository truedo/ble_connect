<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumi BLE Web 통신</title>
    <!-- Web Bluetooth 사용을 위한 권한 정책(Permissions Policy) 메타 태그를 추가합니다. -->
    <meta http-equiv="Permissions-Policy" content="bluetooth=(self)">
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 설정 */
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white shadow-2xl rounded-xl p-6 md:p-8">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">Zumi BLE 통신</h1>
        <p class="text-gray-500 mb-6">ESP32 (ZumiAI) 장치와 웹 브라우저를 통해 통신합니다.</p>

        <!-- 연결 상태 및 버튼 영역 -->
        <div class="space-y-4">
            <div id="status" class="p-3 rounded-lg text-sm font-semibold transition-colors duration-300 bg-red-100 text-red-700">
                연결 상태: 연결되지 않음
            </div>

            <button id="connectButton"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
                블루투스 장치 연결
            </button>
        </div>

        <!-- 데이터 통신 영역 (연결 후 표시) -->
        <div id="communicationArea" class="mt-8 pt-6 border-t border-gray-200 hidden">

            <!-- 데이터 형식 설정 옵션 -->
            <div class="mb-6 p-4 border border-indigo-200 rounded-lg bg-indigo-50">
                <h3 class="font-semibold text-lg mb-2 text-indigo-700">데이터 형식 설정</h3>

                <!-- 쓰기 형식 (Write Format) -->
                <label class="block text-sm font-medium text-gray-700 mb-2">데이터 전송 형식 (Write)</label>
                <div class="flex space-x-4 mb-4" id="writeFormatOptions">
                    <label class="inline-flex items-center">
                        <input type="radio" name="writeFormat" value="ascii" checked class="form-radio text-indigo-600 h-4 w-4">
                        <span class="ml-2 text-sm">ASCII (문자열)</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="writeFormat" value="hex" class="form-radio text-indigo-600 h-4 w-4">
                        <span class="ml-2 text-sm">HEX (16진수, 예: 01 A0 FF)</span>
                    </label>
                </div>

                <!-- 읽기/알림 형식 (Read/Notify Format) -->
                <label class="block text-sm font-medium text-gray-700 mb-2">데이터 수신 형식 (Read/Notify)</label>
                <div class="flex space-x-4" id="readFormatOptions">
                    <label class="inline-flex items-center">
                        <input type="radio" name="readFormat" value="ascii" checked class="form-radio text-indigo-600 h-4 w-4">
                        <span class="ml-2 text-sm">ASCII (문자열)</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="readFormat" value="hex" class="form-radio text-indigo-600 h-4 w-4">
                        <span class="ml-2 text-sm">HEX (16진수)</span>
                    </label>
                </div>
            </div>

            <h2 class="text-xl font-bold text-gray-700 mb-4">데이터 송수신</h2>

            <!-- 1. 통합 거래 기록 (Transaction Log) -->
            <div class="mb-6 p-4 border border-gray-200 rounded-lg">
                <h3 class="font-semibold text-lg mb-2">통신 기록 (Sent/Received Log)</h3>
                <div id="transactionLog" class="p-2 bg-gray-100 rounded text-gray-800 text-sm font-mono break-all max-h-60 overflow-y-auto min-h-[5rem]">
                    -- 통신 기록 없음 --
                </div>
            </div>

            <!-- 3. 데이터 쓰기 (Write) - 수동/자동 공용 입력창 -->
            <div class="mb-6 p-4 border border-gray-200 rounded-lg">
                <h3 class="font-semibold text-lg mb-2">데이터 전송 입력</h3>
                <input type="text" id="writeInput" placeholder="보낼 데이터 (4~30 바이트)를 입력하세요. (예: 5A 01 01 ED)"
                       class="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <button id="writeButton"
                        class="mt-3 w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-semibold rounded-lg transition duration-200">
                    데이터 전송 (0xFFF1)
                </button>
            </div>

            <!-- [추가] 2. 주기적 통신 제어 (Scratch 연동 목표) -->
            <div class="mb-6 p-4 border border-red-200 rounded-lg bg-red-50">
                <h3 class="font-semibold text-lg mb-2 text-red-700">주기적 통신 제어 (80ms ~ 150ms)</h3>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    통신 간격 (ms, 최소 80ms 추천)
                </label>
                <div class="flex space-x-2">
                    <input type="number" id="intervalInput" value="100" min="50" step="10"
                           class="w-1/3 p-2 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 text-center">
                    <button id="toggleLoopButton"
                            class="w-2/3 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold rounded-lg transition duration-200">
                        자동 전송 시작
                    </button>
                </div>
                <p id="loopStatus" class="mt-2 text-sm text-red-700">루프 상태: 중지됨</p>
            </div>

            <!-- 4. Read/Notify 버튼 그룹 -->
            <div class="flex space-x-4 mb-6">
                <div class="w-1/2">
                    <button id="readButton"
                            class="w-full py-2 bg-green-500 hover:bg-green-600 text-white text-sm font-semibold rounded-lg transition duration-200">
                        값 읽기 (Read 0xFFF1)
                    </button>
                </div>
                <div class="w-1/2">
                    <button id="toggleNotifyButton"
                            class="w-full py-2 bg-purple-500 hover:bg-purple-600 text-white text-sm font-semibold rounded-lg transition duration-200">
                        Notify 활성화
                    </button>
                </div>
            </div>

        </div>

        <!-- 메시지 박스 -->
        <div id="messageBox" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
            <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
                <p id="messageText" class="text-gray-700 mb-4"></p>
                <button id="closeMessage" class="w-full py-2 bg-indigo-600 text-white rounded-lg">확인</button>
            </div>
        </div>

    </div>

    <script>
        // UUID 정의 (ESP32 코드와 일치해야 함)
        const PRIMARY_SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb'; // 0xFFF0
        const CHARACTERISTIC_UUID = '0000fff1-0000-1000-8000-00805f9b34fb'; // 0xFFF1

        // DOM 요소 캐시
        const connectButton = document.getElementById('connectButton');
        const statusDiv = document.getElementById('status');
        const communicationArea = document.getElementById('communicationArea');
        const readButton = document.getElementById('readButton');
        const writeButton = document.getElementById('writeButton');
        const writeInput = document.getElementById('writeInput');
        const transactionLogDiv = document.getElementById('transactionLog');
        const toggleNotifyButton = document.getElementById('toggleNotifyButton');

        // [새로 추가된 DOM]
        const toggleLoopButton = document.getElementById('toggleLoopButton');
        const intervalInput = document.getElementById('intervalInput');
        const loopStatusDiv = document.getElementById('loopStatus');

        // 상태 변수
        let zumiDevice = null;
        let zumiCharacteristic = null;
        let isNotifying = false;
        let periodicTimer = null; // 자동 통신 타이머

        // [추가] 주기적 통신에 사용할 데이터 버퍼와 로그 표시 문자열
        let periodicDataBuffer = null;
        let periodicDataDisplay = null;

        // ------------------------ 유틸리티 함수 ------------------------
        /** 주어진 문자열을 ArrayBuffer로 변환 (ASCII) */
        function stringToBytes(str) {
            return new TextEncoder().encode(str);
        }

        /** ArrayBuffer를 문자열로 변환 (ASCII) */
        function bytesToString(buffer) {
            return new TextDecoder().decode(buffer);
        }

        /** HEX 문자열을 ArrayBuffer (Uint8Array)로 변환 */
        function hexStringToBytes(hexString) {
            // 공백 제거 및 유효한 HEX 문자열만 필터링
            const cleaned = hexString.replace(/[^0-9a-fA-F]/g, '');
            if (cleaned.length % 2 !== 0) {
                throw new Error("홀수 길이의 HEX 문자열은 유효하지 않습니다.");
            }

            const bytes = [];
            for (let i = 0; i < cleaned.length; i += 2) {
                bytes.push(parseInt(cleaned.substring(i, i + 2), 16));
            }
            return new Uint8Array(bytes).buffer;
        }

        /** ArrayBuffer를 HEX 문자열로 변환 (띄어쓰기 포함, 대문자) */
        function bytesToHexString(buffer) {
            const byteArray = new Uint8Array(buffer);
            let hexString = '';
            for (let i = 0; i < byteArray.length; i++) {
                // 16진수로 변환하고 2자리로 채운 후 대문자화
                hexString += byteArray[i].toString(16).padStart(2, '0').toUpperCase();
                if (i < byteArray.length - 1) {
                    hexString += ' ';
                }
            }
            return hexString;
        }

        /** 메시지 박스 표시 */
        function showMessage(text) {
            document.getElementById('messageText').textContent = text;
            document.getElementById('messageBox').classList.remove('hidden');
            document.getElementById('messageBox').classList.add('flex');
        }

        document.getElementById('closeMessage').onclick = () => {
            document.getElementById('messageBox').classList.add('hidden');
            document.getElementById('messageBox').classList.remove('flex');
        };

        /** 상태 UI 업데이트 */
        function updateStatus(text, isConnected = false) {
            statusDiv.textContent = '연결 상태: ' + text;
            if (isConnected) {
                statusDiv.classList.remove('bg-red-100', 'text-red-700');
                statusDiv.classList.add('bg-green-100', 'text-green-700');
                communicationArea.classList.remove('hidden');
            } else {
                statusDiv.classList.add('bg-red-100', 'text-red-700');
                statusDiv.classList.remove('bg-green-100', 'text-green-700');
                communicationArea.classList.add('hidden');
                stopPeriodicCommunication(); // 연결 해제 시 루프 중지
            }
        }

        // ------------------------ 데이터 변환 로직 (Read/Notify 공통) ------------------------
        function formatReceivedData(buffer) {
            const readFormat = document.querySelector('input[name="readFormat"]:checked').value;
            let displayValue = '';

            if (readFormat === 'hex') {
                displayValue = bytesToHexString(buffer);
            } else { // ascii
                displayValue = bytesToString(buffer);
            }
            return displayValue;
        }

        // ------------------------ 통합 로그 기록 함수 ------------------------
        /** 통합 거래 기록에 항목 추가 */
        function logTransaction(type, data) {
            const time = new Date().toLocaleTimeString();
            let typeColor = '';

            if (type.includes('Sent')) {
                typeColor = 'text-yellow-600'; // 보낸 데이터
            } else if (type.includes('Received (Read)')) {
                typeColor = 'text-green-600'; // 읽은 데이터
            } else if (type.includes('Received (Notify)')) {
                typeColor = 'text-purple-600'; // 알림 데이터
            } else {
                typeColor = 'text-indigo-600';
            }

            // HTML 엔티티를 사용하여 데이터가 HTML 태그로 해석되는 것을 방지
            const safeData = data.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const newEntry = document.createElement('div');
            newEntry.className = "py-1 border-b border-gray-200 last:border-b-0";
            newEntry.innerHTML = `<span class="font-bold mr-2 text-gray-500">${time}</span> <span class="${typeColor} font-bold mr-2">${type}</span>: ${safeData}`;

            // 기록이 비어 있으면 초기 메시지 제거
            if (transactionLogDiv.textContent.includes('-- 통신 기록 없음 --')) {
                transactionLogDiv.innerHTML = '';
            }

            // 기록의 맨 아래에 추가 (가장 최근 내용이 아래로 오도록)
            transactionLogDiv.appendChild(newEntry);

            // 맨 아래로 스크롤
            transactionLogDiv.scrollTop = transactionLogDiv.scrollHeight;
        }

        // ------------------------ 데이터 유효성 검사 및 변환 ------------------------
        /** * 입력된 문자열을 ArrayBuffer로 변환하고 4~30바이트 크기를 검사합니다.
         * @param {string} data - 입력 문자열 (HEX 또는 ASCII)
         * @returns {{buffer: ArrayBuffer, display: string}} 변환된 버퍼와 로그에 표시할 문자열
         * @throws {Error} 유효성 검사 실패 시 오류 메시지
         */
        function validateAndGetWriteData(data) {
            const writeFormat = document.querySelector('input[name="writeFormat"]:checked').value;
            let bytes;
            let logDisplay = data; // ASCII의 경우 입력값 그대로 사용

            if (data === '') {
                throw new Error('전송할 데이터가 비어있습니다.');
            }

            if (writeFormat === 'hex') {
                bytes = hexStringToBytes(data);
                // HEX의 경우, 로그에 띄어쓰기를 포함한 대문자 형식으로 표시
                logDisplay = bytesToHexString(bytes);
            } else { // ascii
                bytes = stringToBytes(data).buffer;
            }

            // if (bytes.byteLength < 4 || bytes.byteLength > 30) {
            //     throw new Error(`패킷 크기 오류: Write 패킷은 4~30 바이트여야 합니다. 현재 ${bytes.byteLength} 바이트입니다.`);
            // }

            return { buffer: bytes, display: logDisplay };
        }


        // ------------------------ 주기적 통신 로직 ------------------------

        /** BLE Write (writeValueWithoutResponse) 수행 */
        async function writeCommand(dataBuffer, logDisplay) {
             if (!zumiCharacteristic) return;
             try {
                // 주기적 통신은 고속을 위해 Write without response 사용
                await zumiCharacteristic.writeValueWithoutResponse(dataBuffer);
                logTransaction('Sent (Auto)', logDisplay);
            } catch (error) {
                console.error('Auto Write 오류:', error);
                // 루프를 중지하여 에러 반복 방지
                stopPeriodicCommunication();
                showMessage('자동 전송 중 오류 발생: ' + error.message + '. 루프를 중지합니다.');
            }
        }

        function startPeriodicCommunication() {
            if (periodicTimer) {
                showMessage('이미 자동 전송 루프가 실행 중입니다.');
                return;
            }
            if (!zumiCharacteristic) {
                showMessage('먼저 장치에 연결해 주세요.');
                return;
            }

            // 1. 데이터 추출 및 검증
            try {
                const inputData = writeInput.value.trim();
                const validatedData = validateAndGetWriteData(inputData);
                // 전송할 데이터와 로그 표시 문자열 저장
                periodicDataBuffer = validatedData.buffer;
                periodicDataDisplay = validatedData.display;

            } catch (e) {
                // 데이터가 유효하지 않으면 루프 시작을 막고 메시지 표시
                showMessage(`❌ 자동 전송 시작 불가: ${e.message}`);
                return;
            }

            let interval = parseInt(intervalInput.value, 10);
            if (isNaN(interval) || interval < 50) {
                 interval = 100;
                 intervalInput.value = 100;
                 showMessage('유효하지 않은 간격입니다. 100ms로 설정합니다.');
            }

            // Write without response를 사용하므로, Write 작업만 주기적으로 수행
            periodicTimer = setInterval(() => {
                // 저장된 데이터 사용
                writeCommand(periodicDataBuffer, periodicDataDisplay);
            }, interval);

            toggleLoopButton.textContent = '자동 전송 중지';
            toggleLoopButton.classList.remove('bg-red-500', 'hover:bg-red-600');
            toggleLoopButton.classList.add('bg-green-500', 'hover:bg-green-600');
            loopStatusDiv.textContent = `루프 상태: 실행 중 (${interval}ms 간격, 전송 데이터: ${periodicDataDisplay})`;
            console.log(`Periodic communication started at ${interval}ms with data: ${periodicDataDisplay}`);
            showMessage(`✅ 자동 전송 시작: ${interval}ms 간격으로 저장된 데이터 전송`);
        }

        function stopPeriodicCommunication() {
            if (periodicTimer) {
                clearInterval(periodicTimer);
                periodicTimer = null;
                periodicDataBuffer = null;
                periodicDataDisplay = null;
                toggleLoopButton.textContent = '자동 전송 시작';
                toggleLoopButton.classList.remove('bg-green-500', 'hover:bg-green-600');
                toggleLoopButton.classList.add('bg-red-500', 'hover:bg-red-600');
                loopStatusDiv.textContent = '루프 상태: 중지됨';
                console.log('Periodic communication stopped.');
                return true;
            }
            return false;
        }

        toggleLoopButton.onclick = () => {
            if (periodicTimer) {
                stopPeriodicCommunication();
            } else {
                startPeriodicCommunication();
            }
        };


        // ------------------------ 이벤트 핸들러 ------------------------

        /** 장치 연결 이벤트 */
        connectButton.onclick = async () => {
            if (!navigator.bluetooth) {
                showMessage('⚠️ 브라우저가 Web Bluetooth를 지원하지 않습니다. Chrome/Edge를 사용해 주세요.');
                return;
            }

            updateStatus('연결 시도 중...');

            try {
                // 1. 장치 요청 (필터: ZumiAI 장치 & 서비스 UUID)
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ZumiAI' }],
                    // optionalServices는 128비트 문자열 형식으로 전달해야 합니다.
                    optionalServices: [PRIMARY_SERVICE_UUID]
                });

                zumiDevice = device;
                zumiDevice.addEventListener('gattserverdisconnected', onDisconnected);

                updateStatus(`장치 연결 중 (${device.name})...`);

                // 2. GATT 서버 연결
                const server = await device.gatt.connect();

                // 3. 서비스 가져오기
                const service = await server.getPrimaryService(PRIMARY_SERVICE_UUID);

                // 4. Characteristic 가져오기
                zumiCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                updateStatus('연결 성공!', true);
                showMessage(`✅ ${device.name} 장치에 성공적으로 연결되었습니다.`);

            } catch (error) {
                console.error('BLE 연결 오류:', error);
                updateStatus('연결 실패: ' + error.message);
                showMessage(`❌ BLE 연결 실패: ${error.message}`);
            }
        };

        /** 연결 해제 이벤트 */
        function onDisconnected() {
            updateStatus('연결이 해제되었습니다.');
            showMessage('연결된 장치와의 연결이 끊어졌습니다.');
            zumiCharacteristic = null;
            zumiDevice = null;
            // Notify 및 주기적 통신 중지
            isNotifying = false;
            toggleNotifyButton.textContent = 'Notify 활성화';
            stopPeriodicCommunication();

            transactionLogDiv.innerHTML = '-- 통신 기록 없음 --'; // 로그 초기화
        }

        /** Characteristic 값 읽기 이벤트 */
        readButton.onclick = async () => {
            if (!zumiCharacteristic) {
                showMessage('먼저 장치에 연결해 주세요.');
                return;
            }
            try {
                const value = await zumiCharacteristic.readValue();
                const displayValue = formatReceivedData(value.buffer);

                // 통합 로그에 기록
                logTransaction('Received (Read)', displayValue);
                console.log('Read Success:', displayValue, value.buffer);
            } catch (error) {
                console.error('Read 오류:', error);
                showMessage('Read 작업 중 오류가 발생했습니다.');
            }
        };

        /** Characteristic 값 쓰기 이벤트 */
        writeButton.onclick = async () => {
            if (!zumiCharacteristic) {
                showMessage('먼저 장치에 연결해 주세요.');
                return;
            }
            const data = writeInput.value.trim();
            let bytes, logDisplay;

            // 1. 유효성 검사 및 변환 (자동 전송 로직과 동일)
            try {
                const validatedData = validateAndGetWriteData(data);
                bytes = validatedData.buffer;
                logDisplay = validatedData.display;
            } catch (e) {
                showMessage(`❌ 데이터 전송 불가: ${e.message}`);
                return;
            }

            try {
                // 수동 전송은 Write with Response를 사용합니다.
                await zumiCharacteristic.writeValue(bytes);

                // 통합 로그에 기록
                logTransaction('Sent (Manual)', logDisplay);
                writeInput.value = data; // 전송 후 입력 필드는 그대로 둠 (자동 전송을 위해)
                console.log('Write Success:', data);
            } catch (error) {
                console.error('Write 오류:', error);
                showMessage('Write 작업 중 오류가 발생했습니다. 장치 로그를 확인하세요.');
            }
        };

        /** Notify 값 변경 이벤트 리스너 */
        function handleCharacteristicValueChanged(event) {
            const value = event.target.value;
            const displayValue = formatReceivedData(value.buffer);

            // if (value.byteLength < 24 || value.byteLength > 32) {
            //      logTransaction('Received (Notify/Warning)', `크기 오류 (${value.byteLength} 바이트): ${displayValue}`);
            //      console.warn(`Notify received with unexpected size: ${value.byteLength} bytes.`);
            // } else {
            //    // 통합 로그에 기록
                  logTransaction('Received (Notify)', displayValue);
            // }
            console.log('Notify Received:', displayValue, value.buffer);
        }

        /** Notify 활성화/비활성화 토글 */
        toggleNotifyButton.onclick = async () => {
            if (!zumiCharacteristic) {
                showMessage('먼저 장치에 연결해 주세요.');
                return;
            }

            try {
                if (isNotifying) {
                    await zumiCharacteristic.stopNotifications();
                    zumiCharacteristic.removeEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
                    isNotifying = false;
                    toggleNotifyButton.textContent = 'Notify 활성화';
                    toggleNotifyButton.classList.remove('bg-red-500', 'hover:bg-red-600');
                    toggleNotifyButton.classList.add('bg-purple-500', 'hover:bg-purple-600');
                    showMessage('알림(Notification)이 비활성화되었습니다.');
                } else {
                    zumiCharacteristic.addEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
                    await zumiCharacteristic.startNotifications();
                    isNotifying = true;
                    toggleNotifyButton.textContent = 'Notify 비활성화';
                    toggleNotifyButton.classList.remove('bg-purple-500', 'hover:-purple-600');
                    toggleNotifyButton.classList.add('bg-red-500', 'hover:bg-red-600');
                    showMessage('알림(Notification)이 활성화되었습니다. 이제부터 서버에서 보내는 데이터를 받을 수 있습니다.');
                }
            } catch (error) {
                console.error('Notify 토글 오류:', error);
                showMessage('Notify 설정 중 오류가 발생했습니다.');
            }
        };

        // 초기 상태 설정
        updateStatus('연결되지 않음');

    </script>
</body>
